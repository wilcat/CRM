<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fluxo ERP</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">Fluxo ERP</div>
        <div class="brand-sub">GESTÃO EMPRESARIAL</div>
      </div>
    </div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" value="admin@fluxoerp.com" required />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-senha" value="admin123" required />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;" type="submit">Entrar</button>
    </form>
    <div class="hint">Login de demonstração já preenchido — clique em Entrar.</div>
  </div>
</div>

<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">Fluxo ERP</div>
        <div class="brand-sub">GESTÃO EMPRESARIAL</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="user-foot"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="crumb" id="page-crumb">Início</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-ghost btn-sm" id="dark-toggle" title="Alternar modo escuro">🌙</button>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="print-area"></div>

<script src="js/vendor/jsbarcode.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
